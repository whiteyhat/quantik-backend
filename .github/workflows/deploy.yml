name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: e5716b73-1255-4d25-8ef6-8a64f5158289
          RAILWAY_ENVIRONMENT_ID: 791d862d-8437-44ae-bc70-788c7d3d30fb
          RAILWAY_SERVICE_ID: 4496550d-a159-4f26-bbd8-7a0217ec1d0e
